root_overview:
  ai-gen:
    keywords: ontap rest, ontap automation, ontap storage, rest hypermedia, rest query
      parameters
    lead: Explore the ONTAP REST API, which offers a comprehensive set of endpoints
      to interact with ONTAP resources programmatically. This guide provides an overview
      of available API calls, detailing how they can be used to manage clusters, storage,
      and network configurations efficiently. Whether you're provisioning storage
      or monitoring system status, these endpoints support diverse operational needs.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud management,object storage,cloud targets,ontap cloud,storage management
    lead: Manage cloud object storage targets to integrate and maintain cloud resources
      within your ONTAP environment.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,cluster configuration,node management,software update,ntp
      servers,ha group
    lead: Manage cluster creation, node configuration, and software updates using
      these endpoints to set up and maintain your ONTAP cluster environment. Additionally,
      some APIs facilitate cluster creation and monitoring before the cluster is fully
      established.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: networking information,ipspaces,interfaces,routes,ports,broadcast domains
    lead: Explore networking endpoints to report on and manage networking components
      such as IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains. Use these APIs to configure network access and flow in your ONTAP environment,
      ensuring privacy, security, and efficient communication across multiple network
      domains.
- id: svm
  title: ONTAP REST API SVM endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine,svm management,cifs configuration,nfs configuration,network
      services,export policies
    lead: Use Storage Virtual Machine (SVM) APIs to manage SVM attributes and protocol
      configurations, such as CIFS and NFS, within your ONTAP environment. These endpoints
      facilitate secure data access and isolation, presenting each SVM as a dedicated
      server to clients.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,ldap configuration,dns resolution,nsswitch,nis servers
    lead: Access name-services endpoints to configure and manage user authentication
      and credential mapping within your storage environment. Use these endpoints
      to integrate NIS, LDAP, and DNS services, ensuring efficient network information
      retrieval and hostname resolution.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: san management,fibre channel login,wwpn alias,initiator group,lun map
    lead: Configure, provision, and manage SAN-related objects using the ONTAP REST
      API SAN endpoints. These endpoints support operations for defining the storage
      architecture and optimizing data access within a storage area network.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme services,nvme subsystems,fibre channel logins,nvme interfaces,nvme
      namespaces,nvme subsystem maps
    lead: Configure, provision, and manage NVMe objects using these endpoints to optimize
      NVMe storage solutions. Employ the NVMe REST API for seamless integration with
      NVMe and NVMe-oF protocols, ensuring efficient communication over fabric interconnects.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: ontap storage,application templates,netapp best practices,storage management,snapshot
      management
    lead: The ONTAP REST API application endpoints simplify storage management by
      using application-specific terminology, enabling streamlined provisioning and
      management of ONTAP storage objects. These endpoints allow you to manage applications
      efficiently by using templates tailored to specific applications, ensuring adherence
      to NetApp best practices. You can utilize these APIs to view and manage ONTAP
      objects related to applications as cohesive units.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,autosupport settings,event handling,event notifications,email
      parameters
    lead: Use ONTAP support endpoints to manage configuration backups, autosupport
      settings, and event handling. These endpoints help ensure cluster resilience
      and efficient event processing, enhancing your system's reliability and responsiveness.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: security settings, cluster management, svm security, saml configuration,
      identity provider
    lead: Manage security settings for clusters and SVMs using ONTAP security APIs.
      These endpoints help you configure SAML authentication to enhance security through
      third-party Identity Providers.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: storage management,physical storage,logical storage,storage efficiency,aggregate
      management,volume management
    lead: Manage physical and logical storage components such as aggregates, volumes,
      LUNs, qtrees, snapshots, quotas, and storage efficiency. Use these endpoints
      to optimize and organize capacity within your environment.
- id: snapmirror
  title: ONTAP REST API SnapMirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror technology,snapmirror backup,disaster recovery copy,restore
      access,snapmirror relationships,snapmirror transfers
    lead: Utilize SnapMirror endpoints to create and manage asynchronous and synchronous
      SnapMirror relationships, ensuring efficient and scalable replication of production
      data. These endpoints enable you to control policies, manage relationships,
      and oversee data transfers, supporting robust backup and disaster recovery operations.
- id: ndmp
  title: ONTAP REST API NDMP endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: ndmp backups,network data management,svm aware ndmp,ndmp nodes,ndmp
      sessions,ndmp svms
    lead: Use NDMP endpoints to streamline network-based backup for NAS systems. Optimize
      data protection with efficient transfer paths and support for SVM aware NDMP
      backups, enhancing performance and compatibility with ONTAP's advanced features.
- id: snaplock
  title: ONTAP REST API SnapLock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: snaplock retention, snaplock compliance, snaplock legal hold, snaplock
      privileged delete, snaplock file fingerprint, snaplock log
    lead: Administer SnapLock endpoints to enforce write-once, read-many (WORM) data
      retention policies within your storage environment. These endpoints enable you
      to secure data against alteration, even under rigorous regulatory requirements,
      ensuring files remain immutable for designated periods or permanently.
- id: nas
  title: ONTAP REST API NAS endpoints
  permalink: nas_endpoints.html
  ai-gen:
    keywords: nfs server,nfs configuration,export policies,export rules,kerberos authentication,kerberos
      realm
    lead: Utilize the NAS endpoints to configure and manage NFS servers, export policies,
      and Kerberos authentication for your storage virtual machines (SVMs). These
      APIs help you create, update, and secure NFS and export settings, ensuring proper
      access control and authentication in your environment.
subcategories:
- id: manage application snapshots
  permalink: manage_application_snapshots.html
  ai-gen:
    keywords: application snapshots,storage elements,snapshot scheduling,crash consistent,application
      consistent
    lead: Create and manage application snapshots to support data protection across
      storage elements. Use these endpoints to schedule, restore, and flag snapshots
      as either application consistent or crash consistent. For optimal coordination
      between host applications and ONTAP, consider using the SnapCenter Backup Management
      suite.
- id: manage application consistency groups
  permalink: manage_application_consistency_groups.html
  ai-gen:
    keywords: volume snapshot, write fence, crash consistency, snapshot policy, nested
      consistency, svm volumes
    lead: Consistency group APIs facilitate operations on groups of volumes to ensure
      data consistency across multiple volumes. Use these endpoints to perform tasks
      like creating snapshots, replicating, or cloning datasets that span multiple
      volumes, ensuring they are handled collectively rather than individually.
- id: retrieve consistency group metrics
  permalink: retrieve_consistency_group_metrics.html
  ai-gen:
    keywords: historical metrics,consistency group,performance metrics,capacity metrics,space
      metrics,consistency group metrics
